[project]
name = "bencholap"
version = "0.1.0"
description = "Engine-agnostic benchmark harness for analytical query engines and table formats (TPC-H / TPC-DS derived)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "packaging>=24.0",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "sqlglot>=27.0",
    "trino>=0.330",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bencholap = "bencholap.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bencholap"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
