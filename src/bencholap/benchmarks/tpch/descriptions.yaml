# Name of each TPC-H query (from the TPC-H specification) and what it mainly exercises in an engine.
q01: "Pricing Summary Report: scan of almost all of lineitem with a date filter and 8 aggregates over 4 groups"
q02: "Minimum Cost Supplier: 5-table join with a correlated MIN subquery, top 100"
q03: "Shipping Priority: 3-table join with date filters, group by and top 10 by revenue"
q04: "Order Priority Checking: EXISTS semi-join from orders to lineitem with a date range"
q05: "Local Supplier Volume: 6-table join (customer, orders, lineitem, supplier, nation, region)"
q06: "Forecasting Revenue Change: selective filter scan of lineitem (date, discount, quantity ranges)"
q07: "Volume Shipping: 6-table join with two nation aliases and an OR condition"
q08: "National Market Share: 8-table join with a CASE inside an aggregation"
q09: "Product Type Profit Measure: 6-table join with LIKE on part name, group by year and nation"
q10: "Returned Item Reporting: 4-table join with group by on many columns, top 20"
q11: "Important Stock Identification: group by with HAVING against a scalar subquery (fraction depends on SF)"
q12: "Shipping Modes and Order Priority: join with IN list and date ranges, CASE aggregates"
q13: "Customer Distribution: LEFT OUTER JOIN with NOT LIKE, aggregation over an aggregation"
q14: "Promotion Effect: join with a one-month filter and a conditional SUM ratio"
q15: "Top Supplier: CTE (view) with aggregation and a MAX scalar subquery"
q16: "Parts/Supplier Relationship: NOT IN subquery, IN list, COUNT DISTINCT"
q17: "Small-Quantity-Order Revenue: correlated AVG subquery per part"
q18: "Large Volume Customer: IN subquery with group by and HAVING over lineitem, top 100"
q19: "Discounted Revenue: join with three OR-ed groups of predicates"
q20: "Potential Part Promotion: nested IN subqueries with a correlated SUM"
q21: "Suppliers Who Kept Orders Waiting: EXISTS and NOT EXISTS on lineitem (semi and anti joins)"
q22: "Global Sales Opportunity: SUBSTRING IN list, scalar AVG subquery and NOT EXISTS"
