name: tpch
title: TPC-H (derived)
# Results are not audited TPC results and must be labelled "derived from TPC-H".
spec: https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-h_v3.0.1.pdf
tables: [region, nation, supplier, customer, part, partsupp, orders, lineitem]
queries: [q01, q02, q03, q04, q05, q06, q07, q08, q09, q10, q11, q12, q13, q14, q15, q16, q17, q18, q19, q20, q21, q22]
# Canonical queries: qgen -d (spec validation substitution parameters); queries/sfN/ because
# Q11's fraction depends on the scale factor. Official answer sets exist for SF1 only.
scale_factors: [1, 10, 30, 100, 300, 1000]
answers:
  scale_factor: 1
  format: tpch
generator:
  tool: tpcgen-cli
  version: "4.0.0"

default_layout: unpartitioned
layouts:
  unpartitioned:
    description: >
      Unpartitioned, unsorted tables loaded with CREATE TABLE AS SELECT from the generated
      data, as in Trino's own benchmark setup.
    validated: true
    sources:
      - name: Trino benchto TPC-H schema generation (generate-tpch.py)
        url: https://github.com/trinodb/trino/blob/master/testing/trino-benchto-benchmarks/generate_schemas/generate-tpch.py
    analyze: true
    tables: {}


  date-sorted:
    description: >
      lineitem sorted by l_shipdate and orders by o_orderdate when written, so min/max statistics
      let scans skip row groups for the date-range predicates of Q1, Q3-Q7, Q10, Q12, Q14, Q15 and
      Q20. Trino sorts each written file (ranges can overlap between files); row groups have at most 100,000 rows.
    validated: false
    basis: bencholap layout for min/max (row-group) pruning tests, not a published TPC-H setup.
    sources: []
    analyze: true
    tables:
      lineitem: {sorted_by: [l_shipdate], row_group_rows: 100000}
      orders: {sorted_by: [o_orderdate], row_group_rows: 100000}

  date-partitioned:
    description: >
      lineitem partitioned by month(l_shipdate) and orders by month(o_orderdate) (about 80 monthly
      partitions each), so date-range predicates prune whole partitions during planning.
    validated: false
    basis: bencholap layout for partition-pruning tests, not a published TPC-H setup.
    sources: []
    analyze: true
    tables:
      lineitem: {partitioning: ["month(l_shipdate)"]}
      orders: {partitioning: ["month(o_orderdate)"]}

  key-bloom-filters:
    description: >
      Unpartitioned, with Parquet bloom filters on the order and part keys (l_orderkey, l_partkey,
      o_orderkey, p_partkey, ps_partkey). When a selective join produces a dynamic filter with a small
      set of keys, the reader can use the bloom filters to skip row groups.
    validated: false
    basis: bencholap layout for bloom-filter tests, not a published TPC-H setup.
    sources: []
    analyze: true
    tables:
      lineitem: {bloom_filter_columns: [l_orderkey, l_partkey], row_group_rows: 100000}
      orders: {bloom_filter_columns: [o_orderkey], row_group_rows: 100000}
      part: {bloom_filter_columns: [p_partkey]}
      partsupp: {bloom_filter_columns: [ps_partkey]}
