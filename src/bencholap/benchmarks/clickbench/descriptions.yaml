# What each ClickBench query mainly exercises (ClickBench has no official descriptions).
q00: "COUNT(*) of the whole table"
q01: "COUNT(*) with a filter on a small integer column"
q02: "SUM, COUNT and AVG over two columns"
q03: "AVG of a 64-bit column"
q04: "COUNT DISTINCT on a high-cardinality integer (UserID)"
q05: "COUNT DISTINCT on a string column (SearchPhrase)"
q06: "MIN and MAX of a date column"
q07: "filtered group-by on a low-cardinality column, ordered by count"
q08: "group-by with COUNT DISTINCT, top 10"
q09: "group-by with several aggregates and COUNT DISTINCT, top 10"
q10: "string filter, group-by on a string with COUNT DISTINCT"
q11: "group-by on two keys with COUNT DISTINCT"
q12: "group-by on a string column, top 10 by count"
q13: "group-by on a string column with COUNT DISTINCT, top 10"
q14: "group-by on an integer and a string, top 10"
q15: "high-cardinality group-by on UserID, top 10"
q16: "high-cardinality group-by on UserID and SearchPhrase, ordered"
q17: "high-cardinality group-by on UserID and SearchPhrase, LIMIT without ORDER BY"
q18: "group-by on UserID, minute of EventTime and SearchPhrase"
q19: "point lookup: UserID = constant"
q20: "COUNT with URL LIKE '%google%' (string search over a wide column)"
q21: "LIKE filter, group-by with MIN of a string"
q22: "two LIKE filters, group-by with several aggregates and COUNT DISTINCT"
q23: "SELECT * with a LIKE filter, ORDER BY EventTime LIMIT 10 (wide rows, top-N)"
q24: "filter, ORDER BY EventTime LIMIT 10 (top-N)"
q25: "filter, ORDER BY a string LIMIT 10"
q26: "filter, ORDER BY two columns LIMIT 10"
q27: "group-by with AVG(length(URL)) and HAVING"
q28: "REGEXP_REPLACE on Referer as group-by key, with HAVING"
q29: "90 SUM expressions over one column (expression evaluation)"
q30: "filtered group-by on two keys with several aggregates"
q31: "filtered very high-cardinality group-by (WatchID, ClientIP)"
q32: "very high-cardinality group-by (WatchID, ClientIP) on the whole table"
q33: "high-cardinality group-by on URL, top 10"
q34: "group-by on a constant and URL, top 10"
q35: "group-by on ClientIP and three expressions of it"
q36: "CounterID = 62 and July 2013: URL page views (date-range and equality filters)"
q37: "CounterID = 62 and July 2013: Title page views"
q38: "CounterID = 62 and July 2013: link page views, OFFSET"
q39: "CounterID = 62 and July 2013: traffic sources with CASE, OFFSET"
q40: "CounterID = 62 and July 2013: RefererHash = constant, group by URLHash and date, OFFSET"
q41: "CounterID = 62 and July 2013: URLHash = constant, group by window size, OFFSET"
q42: "CounterID = 62 and two days: page views per minute (DATE_TRUNC), OFFSET"
