# How many times each query runs. Requests pick one of these by name.
quick:
  description: smoke check (1 warmup, 3 measured runs, 1 round)
  warmup: 1
  repetitions: 3
  rounds: 1
standard:
  description: default (1 warmup, 5 measured runs, targets alternate in 2 rounds)
  warmup: 1
  repetitions: 5
  rounds: 2
thorough:
  description: small effects (2 warmups, 5 measured runs, 4 alternating rounds)
  warmup: 2
  repetitions: 5
  rounds: 4
