# Run a benchmark request. Started from the form (Actions -> benchmark -> Run workflow, needs
# write access) or called by the issue, release and sweep workflows with an already parsed
# request. Requests can only pick reviewed cluster profiles, presets and variants
# (src/bencholap/profiles/); nobody sets worker counts or Trino properties directly.
#
# Untrusted text from inputs/issues reaches Python only through environment variables and
# is validated there (src/bencholap/request.py) before anything runs.
name: benchmark

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline: release (484), image:<ref>, github:<owner>/<repo>@<ref>, pr-base:<n>"
        required: true
        default: "483"
      change:
        description: "Change: github:<you>/trino@<branch>, pr:<n>, image:<ref> or another release"
        required: true
        default: "484"
      more_targets:
        description: Optional extra targets, space separated
        default: ""
      benchmark:
        type: choice
        options: [tpch, tpcds, clickbench]
        default: tpch
      layouts:
        description: "Table layouts, comma separated (empty = benchmark default; see `bencholap layouts`), e.g. unpartitioned,sorted"
        default: ""
      scale_factor:
        type: choice
        options: ["1", "10", "100"]
        default: "1"
      profile:
        description: Cluster profile (see src/bencholap/profiles/clusters)
        type: choice
        options: [gh-distributed, gh-standard]
        default: gh-standard
      preset:
        description: "Repetitions: quick, standard, thorough"
        type: choice
        options: [quick, standard, thorough]
        default: standard
      queries:
        description: "Queries: all, or a list like q01,q06"
        default: all
      match:
        description: "Only queries whose SQL matches this regex, e.g. avg\\s*\\("
        default: ""
      variants:
        description: Settings variants (see src/bencholap/profiles/variants)
        type: choice
        options: [none, dynamic-filtering]
        default: none
      publish:
        description: Publish to the public results site
        type: boolean
        default: true
  workflow_call:
    inputs:
      request:
        description: Request JSON (see src/bencholap/request.py)
        type: string
        required: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.req.outputs.status }}
      runner: ${{ steps.req.outputs.runner }}
      request: ${{ steps.req.outputs.request }}
      dataset_key: ${{ steps.req.outputs.dataset_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Validate request
        id: req
        env:
          REQ_JSON: ${{ inputs.request }}
          REQ_BASELINE: ${{ inputs.baseline }}
          REQ_CHANGE: ${{ inputs.change }}
          REQ_MORE_TARGETS: ${{ inputs.more_targets }}
          REQ_BENCHMARK: ${{ inputs.benchmark }}
          REQ_SCALE_FACTOR: ${{ inputs.scale_factor }}
          REQ_PROFILE: ${{ inputs.profile }}
          REQ_PRESET: ${{ inputs.preset }}
          REQ_LAYOUTS: ${{ inputs.layouts }}
          REQ_QUERIES: ${{ inputs.queries }}
          REQ_MATCH: ${{ inputs.match }}
          REQ_VARIANTS: ${{ inputs.variants }}
          REQ_PUBLISH: ${{ inputs.publish }}
          REQ_KIND: manual
        run: |
          if [ -n "$REQ_JSON" ]; then uv run bencholap request from-json; else uv run bencholap request from-inputs; fi
          cat request/request.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request
          path: request/

  bench:
    needs: plan
    if: needs.plan.outputs.status == 'valid'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 350
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
    env:
      BENCHOLAP_HOME: ${{ github.workspace }}/.bencholap
      BENCHOLAP_MACHINE_LABEL: ${{ needs.plan.outputs.runner }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - run: uv sync
      - uses: actions/download-artifact@v4
        with: {name: request, path: request}
      - name: Mark issue as running
        if: fromJSON(needs.plan.outputs.request).issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ fromJSON(needs.plan.outputs.request).issue }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label "benchmark: running" || true
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Benchmark started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # Datasets are written once per benchmark and scale factor and shared by all jobs
      # through the cache, so every run reads the same Iceberg snapshot.
      - name: Restore dataset
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dataset-state.tar
          key: ${{ needs.plan.outputs.dataset_key }}-${{ hashFiles('src/bencholap/benchmarks/**/benchmark.yaml', 'src/bencholap/dataset.py', 'src/bencholap/stack.py') }}
      - name: Import dataset
        if: steps.cache.outputs.cache-hit == 'true'
        run: uv run bencholap stack import dataset-state.tar
      - name: Cache Maven repository (source builds)
        uses: actions/cache@v4
        with:
          path: .bencholap/cache/trino/m2
          key: m2-${{ github.run_id }}
          restore-keys: m2-
      - name: Run
        id: run
        run: uv run bencholap request run request/request.json -o results
      - name: Save dataset
        if: steps.cache.outputs.cache-hit != 'true' && success()
        run: uv run bencholap stack export dataset-state.tar
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true' && success()
        with:
          path: dataset-state.tar
          key: ${{ needs.plan.outputs.dataset_key }}-${{ hashFiles('src/bencholap/benchmarks/**/benchmark.yaml', 'src/bencholap/dataset.py', 'src/bencholap/stack.py') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results/
            .bencholap/engines/*/*.log
          if-no-files-found: ignore

  publish:
    needs: [plan, bench]
    if: needs.bench.result == 'success' && fromJSON(needs.plan.outputs.request).publish
    runs-on: ubuntu-24.04
    concurrency: {group: publish-results, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: results, path: results-branch}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: actions/download-artifact@v4
        with: {name: results, path: artifact}
      - name: Commit run to the results branch
        env:
          RUN_ID: ${{ needs.bench.outputs.run_id }}
        run: |
          uv run bencholap publish "artifact/results/$RUN_ID" --results-repo results-branch
          cd results-branch
          git config user.name "bencholap-bot"
          git config user.email "bencholap-bot@users.noreply.github.com"
          git add runs
          git commit -m "Add run $RUN_ID"
          for i in 1 2 3 4 5; do git pull --rebase origin results && git push origin HEAD:results && break; sleep $((i * 5)); done

  site:
    needs: publish
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  report:
    needs: [plan, bench, publish, site]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: results, path: artifact}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: request, path: request}
      - name: Summary and issue comment
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ needs.plan.outputs.request }}
          STATUS: ${{ needs.plan.outputs.status }}
          BENCH: ${{ needs.bench.result }}
          PUBLISHED: ${{ needs.publish.result }}
          RUN_ID: ${{ needs.bench.outputs.run_id }}
        run: |
          issue=$(jq -r '.issue // empty' <<< "$REQUEST")
          owner=${GITHUB_REPOSITORY%%/*}; name=${GITHUB_REPOSITORY#*/}
          site="https://${owner}.github.io/${name}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "<!-- bencholap-result -->"
            if [ "$STATUS" != "valid" ]; then
              echo "### ❌ Request is not valid"; echo; cat request/request.md 2>/dev/null || true
            elif [ "$BENCH" = "success" ]; then
              cat "artifact/results/$RUN_ID/summary.md"
              echo
              if [ "$PUBLISHED" = "success" ]; then echo "**Report:** $site/runs/$RUN_ID/index.html"; fi
              echo "Workflow run and raw results (artifact \`results\`): $run_url"
            else
              echo "### ❌ Benchmark failed"; echo; echo "See the workflow run: $run_url"
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file comment.md
            gh issue edit "$issue" -R "$GITHUB_REPOSITORY" --remove-label "benchmark: running" || true
            if [ "$BENCH" = "success" ]; then label="benchmark: done"; else label="benchmark: failed"; fi
            gh issue edit "$issue" -R "$GITHUB_REPOSITORY" --add-label "$label" || true
            # a finished benchmark closes its request; a failed one stays open so it can be fixed and re-approved
            if [ "$BENCH" = "success" ]; then
              gh issue close "$issue" -R "$GITHUB_REPOSITORY" --reason completed || true
            fi
          fi
