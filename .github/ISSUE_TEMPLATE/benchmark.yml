name: 📊 Benchmark request
description: Compare Trino builds on TPC-H / TPC-DS. A maintainer approves it, it runs on GitHub, and the results are posted here.
title: "Benchmark: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        ## How it works
        1. **Fill in the form** and submit. A bot checks the request and comments exactly what will run (or what to fix).
        2. **A maintainer approves** it by adding the `benchmark: approved` label.
        3. **It runs on GitHub.** The bot links the workflow run, then posts the results here with a link to the
           interactive report on the [results site](https://shohamyamin.github.io/bencholap/), and closes the issue.

        ### What can I compare?
        | target | example |
        |---|---|
        | a Trino release | `484` |
        | a published image | `image:ghcr.io/you/trino:my-tag` |
        | a fork branch or commit | `github:you/trino@my-branch` or `https://github.com/you/trino/tree/my-branch` |
        | a pull request and its merge base | `pr:12345` and `pr-base:12345` |

        > [!TIP]
        > Compare against the commit your change is based on (for a PR: `pr-base:<n>`), not against an unrelated
        > release. Branches and PRs are built from source, which takes a while; a published image avoids the build.
  - type: input
    id: baseline
    attributes:
      label: Baseline
      description: What you compare against (first target).
      placeholder: "pr-base:12345  or  github:trinodb/trino@<commit>  or  484"
    validations:
      required: true
  - type: input
    id: change
    attributes:
      label: Change
      description: Your build.
      placeholder: "pr:12345  or  github:you/trino@faster-avg"
    validations:
      required: true
  - type: input
    id: more
    attributes:
      label: More targets
      description: Optional, space separated.
  - type: dropdown
    id: benchmark
    attributes:
      label: Benchmark
      options:
        - tpch (TPC-H derived, 22 queries)
        - tpcds (TPC-DS derived, 99 queries)
        - clickbench (ClickBench derived, 43 queries on one wide table)
      default: 0
    validations:
      required: true
  - type: dropdown
    id: layouts
    attributes:
      label: Table layouts
      description: >
        How the tables are written (pick one or more; every target runs on each).
        TPC-H: unpartitioned, date-sorted, date-partitioned, key-bloom-filters.
        TPC-DS: unpartitioned, date-partitioned.
        ClickBench: unpartitioned, small-row-groups, sorted, date-partitioned, bloom-filters.
        Only "unpartitioned" (and TPC-DS date-partitioned) follow published setups; the others are
        bencholap layouts for testing partition, min/max and bloom-filter pruning.
      multiple: true
      options:
        - unpartitioned
        - date-partitioned
        - date-sorted
        - key-bloom-filters
        - small-row-groups
        - sorted
        - bloom-filters
      default: 0
  - type: dropdown
    id: scale_factor
    attributes:
      label: Scale factor
      description: >
        Must be supported by the cluster profile. GitHub runners: SF1 for TPC-H / TPC-DS, SF1 or SF10 for
        ClickBench (SF N = first N million rows of ClickBench's 100 files; only SF100 is the full dataset).
      options: ["1", "10", "100"]
      default: 0
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Cluster profile
      description: >
        Where Trino runs. gh-standard = free GitHub runner, single node.
        gh-distributed = same runner, coordinator + 2 workers (distributed plans, not scaling).
        Need another setup? Propose a profile in src/bencholap/profiles/clusters with a pull request.
      options:
        - gh-distributed
        - gh-standard
      default: 1
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Repetitions
      options:
        - quick (1 warmup, 3 runs)
        - standard (1 warmup, 5 runs, 2 alternating rounds)
        - thorough (2 warmups, 5 runs, 4 alternating rounds)
      default: 1
    validations:
      required: true
  - type: input
    id: queries
    attributes:
      label: Queries
      description: "all, or a comma separated list such as q01,q06,q17"
      value: all
  - type: input
    id: match
    attributes:
      label: Query filter
      description: "Optional regular expression; only queries whose SQL matches run. Example for an avg optimization: avg\\s*\\("
  - type: dropdown
    id: variants
    attributes:
      label: Settings variants
      description: Run every target with a reviewed set of settings (src/bencholap/profiles/variants).
      options:
        - defaults (no variants)
        - dynamic-filtering
      default: 0
  - type: dropdown
    id: publish
    attributes:
      label: Publish results
      description: Publish the report on the public results site.
      options: ["yes", "no"]
      default: 0
  - type: textarea
    id: description
    attributes:
      label: What are you testing?
      description: Shown in the report.
