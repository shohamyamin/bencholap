name: 🐞 Bug report
description: Something in bencholap is broken (a workflow, the report, the site, validation, a dataset).
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If a benchmark result looks wrong, link the run so we can look at the raw `result.json`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the run, report or issue
      placeholder: https://github.com/shohamyamin/bencholap/actions/runs/... or https://shohamyamin.github.io/bencholap/runs/...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Benchmark workflow / issue bot
        - Report or results site
        - Answer validation (wrong result flagged)
        - Dataset build
        - Trino target resolution or build
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
